<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica JS Ana Yepes</title>
    <script src="script.js"></script>
  </head>
  <body>
    <main>
      <h1>Registro de Jugador</h1>

      <!-- Campos de texto y fecha: es un formulario -->
      <form id="form-jugador">
        <label for="nombre">Nombre del jugador:</label>
        <input type="text" id="nombre" required />

        <br /><br />

        <label for="fecha-nacimiento">Fecha de nacimiento:</label>
        <!-- Usamos un input tipo date para validar la fecha -->
        <input type="date" id="fecha-nacimiento" required />

        <br /><br />

        <button type="submit" id="btn-jugar">Comenzar Juego</button>
      </form>
      <p id="mensaje" role="status"></p> <!--Para mostrar mensajes al usuario sin usar alert()-->

      <!--AQUI EMPIEZA EL JUEGO-->
      <section id="panel-juego" hidden> <!--Contenedor del juego. Lo empiezo en hidden para que solo se vea el formulario de registro. Cuando los datos sean válidos ya aparece-->
        <h2>Tu aventura</h2>
        <div id="perfil"></div>
        <div id="contenido-juego"> 
          <h3>Adivina el número secreto</h3>

          <p>¿En qué número del 1 al 10 estoy pensando?</p>

          <label for="numero">Escribe tu número: </label>
          <input type="number" id="numero" min="1" max="10" required /> <!--Para que meta un numero entre 1 y 10 con require para que sea obligatorio -->

          <button type="button" id="btn-adivinar">Adivinar</button>
          <button type="button" id="btn-ayuda">Ayuda</button> <!--Añado el botón de ayuda-->

          <p id="mensaje-juego" role="status"></p>

          <p>Puntuación: <span id="puntuacion">0</span></p>

          <h3>Historial de intentos</h3>
          <ul id="historial"></ul>

          <button type="button" id="btn-ayuda">Ayuda</button>

        </div>
      </section>
    </main>
  </body>
</html>
